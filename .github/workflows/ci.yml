name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain (GHC, BNFC, OCaml)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghc bnfc happy alex libghc-syb-dev libghc-hspec-dev \
            ocaml ocaml-findlib libounit-ocaml-dev

      # The runner image ships a ghcup GHC that cannot see apt's Haskell
      # libraries; put /usr/bin first so the apt toolchain wins.
      - name: Prefer apt toolchain over preinstalled ghcup
        run: echo "/usr/bin" >> "$GITHUB_PATH"

      # ---- Haskell desugarer ----
      - name: Build desugarer
        run: make -C src/desugar

      - name: Desugarer example tests
        run: make -C src/desugar test

      - name: Desugarer unit tests + C0 coverage (hspec + HPC)
        run: make -C src/desugar coverage

      # ---- OCaml core interpreter ----
      - name: Build core interpreter
        run: make -C src/core

      - name: Core smoke test
        run: make -C src/core test

      - name: Core unit tests (OUnit2)
        run: make -C src/core unittest

      # ---- End-to-end: desugar → run on the core interpreter ----
      - name: E2E reverse-case
        run: |
          src/desugar/DesugarWhile examples/desugar/reverse-case.while > /tmp/p.while
          out=$(src/core/while /tmp/p.while examples/list123.val)
          echo "$out"
          test "$out" = "('3 . ('2 . ('1 . nil)))"

      - name: E2E universal program (self-interpreter)
        run: |
          src/desugar/DesugarWhile examples/desugar/universal.while > /tmp/u.while
          src/desugar/DesugarWhile --data examples/desugar/reverse-indent.while > /tmp/rev.val
          printf '(%s . %s)' "$(cat /tmp/rev.val)" "$(cat examples/list123.val)" > /tmp/pd.val
          out=$(src/core/while /tmp/u.while /tmp/pd.val)
          echo "$out"
          test "$out" = "('3 . ('2 . ('1 . nil)))"

      # ---- Futamura projections / offline PE: native tools + full e2e suite ----
      - name: Build offline/Futamura native tools (rundata, cogen, bta, simp, annotate)
        run: make -C src/core rundata cogen bta simp annotate

      # run-all.sh runs every fast test-*.sh: the oracle cross-check (rundata vs
      # while), the Futamura/offline suite (futamura, fp-triv, noninj, bta, genext,
      # cogen) AND the ch.19 suite (timed-universal, diag, onevar, efficient-tu).
      - name: E2E test suite (oracle, Futamura fp1/fp2-triv, BTA, cogen, ch.19 …)
        run: sh examples/desugar/run-all.sh

  # Agda design-spec proofs (proofs/agda/*.agda, all --safe).  Best-effort for now:
  # continue-on-error keeps the workflow green while we confirm the CI Agda /
  # standard-library versions match what the modules need (locally: Agda 2.8.0 +
  # stdlib 2.x).  Promote to blocking once a CI run is confirmed green.
  proofs:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Agda + standard-library
        uses: wenkokke/setup-agda@v2
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: '2.1.1'
      - name: Type-check design-spec proofs (--safe)
        run: sh proofs/agda/check.sh
